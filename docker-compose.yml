version: "3.9"
services:
  bot:
    build: .
    env_file: .env
    command: python main.py --mode polymarket
    volumes: [./data:/app/data, ./logs:/app/logs, ./model:/app/model]
    depends_on: [qdrant, ollama]
    restart: unless-stopped

  dashboard:
    build: .
    env_file: .env
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: [./data:/app/data]
    depends_on: [bot]
    restart: unless-stopped

  webhook:
    build: .
    env_file: .env
    command: uvicorn n8n.webhook_server:app --host 0.0.0.0 --port 8080
    ports: ["8080:8080"]
    volumes: [./data:/app/data]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
