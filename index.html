<!doctype html>
<html lang="id">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>md90_superlayerAi — Market Intelligence Cockpit</title>
    <meta name="description" content="Transparent market intelligence cockpit for signal evidence, risk boundaries, and paper-first trading research." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />    
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showBootFailure(message) {
          try { console.error("[md90 boot]", message); } catch (_) {}
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0 || root.querySelector("[data-boot-fallback]")) return;
          var panel = document.createElement("main");
          panel.setAttribute("data-boot-fallback", "true");
          panel.style.cssText = "min-height:100vh;display:grid;place-items:center;padding:32px;background:#080b0a;color:#e9e7df;font-family:system-ui,sans-serif";
          panel.innerHTML = "<section style=\"max-width:560px;border:1px solid #38534d;padding:28px;background:#101613\"><p style=\"color:#22c7b8;font:600 11px ui-monospace,monospace;letter-spacing:.16em\">MD90_SUPERLAYERAI / BOOT STATUS</p><h1 style=\"font-size:24px;margin:12px 0\">Client surface belum siap.</h1><p style=\"color:#a7b0aa;line-height:1.6;margin:0\">Aplikasi gagal memuat modul antarmuka. Tidak ada order yang dikirim. Muat ulang halaman atau periksa deployment logs.</p><p style=\"color:#e4a94a;font:600 11px ui-monospace,monospace;letter-spacing:.12em;margin:20px 0 0\">PAPER / SHADOW ONLY · LIVE DISABLED</p></section>";
          root.appendChild(panel);
        }
        window.addEventListener("error", function () { showBootFailure("window-error"); });
        window.addEventListener("unhandledrejection", function () { showBootFailure("module-rejection"); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
